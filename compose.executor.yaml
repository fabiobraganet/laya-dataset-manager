services:
  kaggle-executor:
    build:
      context: .
      dockerfile: training/executor/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ${KAGGLE_CONFIG_DIR:-/root/.kaggle}/kaggle.json:/root/.kaggle/kaggle.json:ro
      - kaggle-run-state:/state
      - laya-model-artifacts:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s
volumes:
  kaggle-run-state:
  laya-model-artifacts:
    name: laya-dataset-manager-model-artifacts
